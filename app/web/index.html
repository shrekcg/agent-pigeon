<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 信鸽</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="sidebar">
  <div class="side-top" data-drag>
    <span class="brand"><img src="icons/app.svg" alt="" width="18" height="18"><span>Agent 信鸽</span></span>
  </div>
  <nav class="nav" aria-label="主导航">
    <button data-view="overview">
      <svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
      <span>概览</span>
    </button>
    <button data-view="channels">
      <svg viewBox="0 0 20 20"><path d="M4 5.5h12a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H9l-3.5 2.5V14H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/></svg>
      <span>渠道</span>
    </button>
    <button data-view="agents">
      <svg viewBox="0 0 20 20"><rect x="4" y="6" width="12" height="9" rx="2"/><path d="M10 6V3.5M7.5 10.5h0M12.5 10.5h0"/><circle cx="10" cy="3" r=".6"/></svg>
      <span>Agent</span>
    </button>
    <button data-view="sessions">
      <svg viewBox="0 0 20 20"><path d="M6 4.5h8M4 8.5h12M4 12.5h12M6 16.5h8"/></svg>
      <span>会话</span>
    </button>
  </nav>
  <div class="side-foot">
    <button data-view="settings" class="nav-foot">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
      <span>设置</span>
    </button>
    <div class="engine" id="engine"><i></i><span>连接中…</span></div>
  </div>
</aside>

<main>
  <header class="top" data-drag>
    <h1 id="title">概览</h1>
    <div class="actions">
      <button class="btn" id="pauseBtn" hidden></button>
    </div>
  </header>
  <div class="scroll"><div class="page" id="page"></div></div>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
